[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-harness-maker"
version = "0.1.0.dev0"
description = "Contract, verification, and session handoff scaffolding for Codex"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["controller*", "verifier*", "eval*", "plugin*", "harness*"]
exclude = ["tests*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests/lead", "tests/plugin", "tests/controller", "tests/verifier", "tests/eval"]
addopts = "-ra"
